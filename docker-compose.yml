services:
  ###################
  # Frontend Client #
  ###################
  client:
    build:
      context: .  
      dockerfile: Dockerfile
      target: client-dev
    ports:
      - "5173:5173"
    volumes:
      # Mounting code for hot reloading
      - ./client:/app/client
      - /app/client/node_modules
    environment:
      - NODE_ENV=development

  ###################
  # Backend Service #
  ###################
  backend:
    build:
      context: .
      dockerfile: Dockerfile  
      target: runtime
    ports:
      - "8080:8080" 
    env_file:
      - ./backend/.env.dev
